<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ · Анкеты гостей</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bordeaux: #6b1e2b;
            --white: #ffffff;
            --cream: #f9f5f2;
            --olive: #6b7a4b;
            --olive-soft: #b7bf9a;
            --text-dark: #2e1e1e;
        }

        body {
            background: #fdfaf8;
            font-family: 'Jost', sans-serif;
            color: var(--text-dark);
            line-height: 1.5;
            min-height: 100vh;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-box {
            background: var(--white);
            border: 1px solid rgba(107, 30, 43, 0.15);
            box-shadow: 0 12px 40px rgba(107, 30, 43, 0.08);
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .login-box h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2rem;
            color: var(--bordeaux);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .login-box p {
            font-weight: 300;
            color: #7a5e5e;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(107, 30, 43, 0.2);
            background: var(--white);
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            outline: none;
            margin-bottom: 16px;
            text-align: center;
        }

        .login-box input:focus {
            border-color: var(--olive);
            box-shadow: 0 0 0 3px rgba(107, 122, 75, 0.1);
        }

        .login-box button {
            width: 100%;
            background: var(--bordeaux);
            color: var(--white);
            border: none;
            padding: 16px;
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-box button:hover { background: #521a24; }

        .login-error {
            color: #b3413f;
            font-size: 0.9rem;
            margin-top: 12px;
            min-height: 20px;
        }

        .admin-panel {
            display: none;
            padding: 40px 24px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid rgba(107, 30, 43, 0.15);
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        .admin-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 2.2rem;
            color: var(--bordeaux);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .admin-header .sub {
            font-weight: 300;
            color: var(--olive);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 12px 24px;
            font-family: 'Jost', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 0;
        }

        .btn-primary { background: var(--bordeaux); color: var(--white); }
        .btn-primary:hover { background: #521a24; }

        .btn-outline {
            background: transparent;
            color: var(--bordeaux);
            border: 1px solid var(--bordeaux);
        }
        .btn-outline:hover { background: var(--bordeaux); color: var(--white); }

        .btn-olive { background: var(--olive); color: var(--white); }
        .btn-olive:hover { background: #56633c; }

        .btn-danger {
            background: transparent;
            color: #b3413f;
            border: 1px solid #b3413f;
        }
        .btn-danger:hover { background: #b3413f; color: var(--white); }

        .btn-sm { padding: 8px 16px; font-size: 0.75rem; letter-spacing: 1.5px; }

        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid rgba(107, 30, 43, 0.12);
            padding: 20px 28px;
            min-width: 160px;
            flex: 1 1 160px;
        }

        .stat-card .num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 600;
            color: var(--bordeaux);
            line-height: 1;
        }

        .stat-card .lbl {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--olive);
            margin-top: 6px;
        }

        .table-wrap {
            background: var(--white);
            border: 1px solid rgba(107, 30, 43, 0.12);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }

        th {
            text-align: left;
            padding: 16px 18px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--bordeaux);
            border-bottom: 2px solid rgba(107, 30, 43, 0.15);
            background: var(--cream);
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(107, 30, 43, 0.08);
            font-weight: 300;
            font-size: 0.95rem;
            vertical-align: top;
        }

        tr:hover td { background: #fdf8f6; }

        .drinks-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: var(--olive-soft);
            color: #2e3a1e;
            padding: 3px 12px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9b8484;
            font-weight: 300;
        }

        .empty-state .big {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--olive);
            margin-bottom: 8px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(46, 30, 30, 0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--white);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .modal h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 1.6rem;
            color: var(--bordeaux);
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--bordeaux);
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(107, 30, 43, 0.2);
            background: var(--white);
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--olive);
            box-shadow: 0 0 0 3px rgba(107, 122, 75, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin-top: 6px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 300;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .checkbox-item input {
            width: 17px;
            height: 17px;
            accent-color: var(--olive);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .modal-actions .btn { flex: 1 1 120px; }

        @media (max-width: 640px) {
            .admin-header h1 { font-size: 1.6rem; }
            .admin-panel { padding: 24px 16px 60px; }
            .login-box { padding: 36px 24px; }
        }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>Админ-панель</h1>
            <p>Введите пароль для доступа к анкетам гостей</p>
            <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
            <button onclick="tryLogin()">Войти</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <div>
                <h1>Анкеты гостей</h1>
                <div class="sub">Айаана &amp; Герман · 11.10.2026</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-olive" onclick="exportCSV()">Экспорт CSV</button>
                <button class="btn btn-outline" onclick="refreshData()">Обновить</button>
                <button class="btn btn-outline" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Персон</th>
                        <th>Напитки</th>
                        <th>Пожелания</th>
                        <th>Отправлено</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="guestsTable"></tbody>
            </table>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="big">Пока нет ответов</div>
            <div>Как только гости заполнят анкету, они появятся здесь.</div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>Редактировать анкету</h2>
            <input type="hidden" id="editId">

            <div class="form-group">
                <label class="form-label" for="editName">Имя и фамилия</label>
                <input class="form-input" type="text" id="editName">
            </div>

            <div class="form-group">
                <label class="form-label" for="editPersons">Количество персон</label>
                <select class="form-select" id="editPersons">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Предпочитаемые напитки</label>
                <div class="checkbox-group" id="editDrinks">
                    <label class="checkbox-item"><input type="checkbox" value="Красное вино"> Красное вино</label>
                    <label class="checkbox-item"><input type="checkbox" value="Белое вино"> Белое вино</label>
                    <label class="checkbox-item"><input type="checkbox" value="Шампанское"> Шампанское</label>
                    <label class="checkbox-item"><input type="checkbox" value="Водка"> Водка</label>
                    <label class="checkbox-item"><input type="checkbox" value="Виски"> Виски</label>
                    <label class="checkbox-item"><input type="checkbox" value="Коньяк"> Коньяк</label>
                    <label class="checkbox-item"><input type="checkbox" value="Безалкогольные"> Безалкогольные</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="editAllergies">Аллергии / пожелания по меню</label>
                <textarea class="form-textarea" id="editAllergies" rows="3"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
                <button class="btn btn-outline" onclick="closeEdit()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  НАСТРОЙКИ ДОСТУПА И JSONBIN — ВСТАВЬТЕ СВОИ ЗНАЧЕНИЯ
        // ============================================================
        const ADMIN_PASSWORD  = 'AyanaHerman2026';   // ← поменяйте на свой пароль
        const JSONBIN_BIN_ID  = '6aa4e675ffd5d16053fd0267';
        const JSONBIN_API_KEY = '$2a$10$cX7JFIjWiEH2NMams593.enkJEL.dElXb.1NYjP5PS4LSpXiFwgh6';
        const JSONBIN_URL     = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;
        const SESSION_KEY     = 'wedding_admin_auth';

        // ============================================================
        //  АВТОРИЗАЦИЯ
        // ============================================================
        function tryLogin() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('loginError');

            if (input.value === ADMIN_PASSWORD) {
                sessionStorage.setItem(SESSION_KEY, 'true');
                showPanel();
            } else {
                error.textContent = 'Неверный пароль';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tryLogin();
        });

        function showPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            refreshData();
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        if (sessionStorage.getItem(SESSION_KEY) === 'true') {
            showPanel();
        }

        // ============================================================
        //  ДАННЫЕ (JSONBIN)
        // ============================================================
        let cachedGuests = [];

        async function loadGuests() {
            const resp = await fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!resp.ok) throw new Error('Ошибка загрузки');
            const data = await resp.json();
            cachedGuests = Array.isArray(data.record) ? data.record : [];
            return cachedGuests;
        }

        async function saveGuests(guests) {
            const resp = await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(guests)
            });
            if (!resp.ok) throw new Error('Ошибка сохранения');
            cachedGuests = guests;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        async function refreshData() {
            const tableWrap = document.querySelector('.table-wrap');
            const empty = document.getElementById('emptyState');

            try {
                const guests = await loadGuests();
                renderStats(guests);
                renderTable(guests);
            } catch (err) {
                console.error(err);
                empty.style.display = 'block';
                empty.innerHTML = '<div class="big">Ошибка загрузки</div><div>Проверьте Bin ID и API Key.</div>';
                tableWrap.style.display = 'none';
            }
        }

        function renderStats(guests) {
            const totalGuests = guests.length;
            const totalPersons = guests.reduce((sum, g) => sum + (parseInt(g.persons) || 0), 0);

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="num">${totalGuests}</div>
                    <div class="lbl">Анкет</div>
                </div>
                <div class="stat-card">
                    <div class="num">${totalPersons}</div>
                    <div class="lbl">Всего персон</div>
                </div>
            `;
        }

        function renderTable(guests) {
            const tbody = document.getElementById('guestsTable');
            const empty = document.getElementById('emptyState');
            const tableWrap = document.querySelector('.table-wrap');

            if (guests.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                empty.innerHTML = '<div class="big">Пока нет ответов</div><div>Как только гости заполнят анкету, они появятся здесь.</div>';
                tableWrap.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            tableWrap.style.display = 'block';

            tbody.innerHTML = guests.map(g => {
                const drinksHtml = (g.drinks && g.drinks.length)
                    ? g.drinks.map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('')
                    : '<span style="color:#9b8484;">—</span>';

                return `
                    <tr>
                        <td><strong>${escapeHtml(g.name || '')}</strong></td>
                        <td>${escapeHtml(String(g.persons || ''))}</td>
                        <td><div class="drinks-cell">${drinksHtml}</div></td>
                        <td>${g.allergies ? escapeHtml(g.allergies) : '<span style="color:#9b8484;">—</span>'}</td>
                        <td>${formatDate(g.createdAt)}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="openEdit('${g.id}')">Изменить</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteGuest('${g.id}')" style="margin-left:6px;">Удалить</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================================
        //  РЕДАКТИРОВАНИЕ
        // ============================================================
        function openEdit(id) {
            const guest = cachedGuests.find(g => g.id === id);
            if (!guest) return;

            document.getElementById('editId').value = guest.id;
            document.getElementById('editName').value = guest.name || '';
            document.getElementById('editPersons').value = guest.persons || '1';
            document.getElementById('editAllergies').value = guest.allergies || '';

            document.querySelectorAll('#editDrinks input[type="checkbox"]').forEach(cb => {
                cb.checked = (guest.drinks || []).includes(cb.value);
            });

            document.getElementById('editModal').classList.add('active');
        }

        function closeEdit() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const index = cachedGuests.findIndex(g => g.id === id);
            if (index === -1) return;

            const drinks = [];
            document.querySelectorAll('#editDrinks input[type="checkbox"]:checked').forEach(cb => {
                drinks.push(cb.value);
            });

            cachedGuests[index].name = document.getElementById('editName').value.trim();
            cachedGuests[index].persons = document.getElementById('editPersons').value;
            cachedGuests[index].drinks = drinks;
            cachedGuests[index].allergies = document.getElementById('editAllergies').value.trim();

            try {
                await saveGuests(cachedGuests);
                closeEdit();
                refreshData();
            } catch (err) {
                alert('Не удалось сохранить изменения.');
                console.error(err);
            }
        }

        // ============================================================
        //  УДАЛЕНИЕ
        // ============================================================
        async function deleteGuest(id) {
            if (!confirm('Удалить эту анкету? Действие необратимо.')) return;

            const updated = cachedGuests.filter(g => g.id !== id);
            try {
                await saveGuests(updated);
                refreshData();
            } catch (err) {
                alert('Не удалось удалить.');
                console.error(err);
            }
        }

        // ============================================================
        //  ЭКСПОРТ CSV
        // ============================================================
        function exportCSV() {
            const guests = cachedGuests;
            if (guests.length === 0) {
                alert('Нет данных для экспорта.');
                return;
            }

            const headers = ['Имя', 'Персон', 'Напитки', 'Пожелания', 'Дата отправки'];
            const rows = guests.map(g => [
                g.name || '',
                g.persons || '',
                (g.drinks || []).join(', '),
                g.allergies || '',
                formatDate(g.createdAt)
            ]);

            const csv = [headers, ...rows]
                .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';'))
                .join('\n');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'wedding_guests_' + new Date().toISOString().slice(0, 10) + '.csv';
            link.click();
        }

        // ============================================================
        //  ВСПОМОГАТЕЛЬНОЕ
        // ============================================================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEdit();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeEdit();
        });
    </script>
</body>
</html>
